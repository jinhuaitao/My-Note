<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · Cloud Note</title>
{{FAVICON}}
<style>
  :root{
    --bg:#08080c; --text:#e8e8f0; --dim:#9a9aae; --border:rgba(255,255,255,.09);
    --danger:#f87171; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    background-image:
      radial-gradient(900px 520px at 50% -10%, rgba(124,92,255,.20), transparent 62%),
      radial-gradient(700px 420px at 90% 100%, rgba(34,211,238,.10), transparent 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    padding:24px;
  }
  .card{
    width:100%;max-width:420px;text-align:center;padding:44px 36px;
    background:rgba(22,22,30,.72);border:1px solid var(--border);border-radius:20px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .icon{
    width:64px;height:64px;margin:0 auto 22px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);color:var(--danger);
  }
  h1{font-size:19px;margin:0 0 12px;font-weight:600;letter-spacing:.2px}
  p{margin:0 0 28px;font-size:14px;line-height:1.75;color:var(--dim)}
  .btn{
    display:inline-block;padding:11px 24px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#7c5cff,#6d4bf0);color:#fff;font-size:14px;font-weight:500;
    transition:transform .18s ease, box-shadow .18s ease;font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.35)}
  .hint{margin-top:18px;font-size:12px;color:#5f5f74}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <button class="btn" id="closeBtn" type="button">关闭此页面</button>
    <div class="hint" id="hint"></div>
  </div>
<script>
  (function () {
    var btn = document.getElementById('closeBtn');
    btn.addEventListener('click', function () {
      try { window.opener = null; window.open('', '_self'); window.close(); } catch (e) {}
      setTimeout(function () {
        btn.textContent = '请手动关闭此标签页';
        btn.style.background = '#3a3a48';
        btn.style.cursor = 'not-allowed';
        document.getElementById('hint').textContent = '如果页面没有自动关闭，直接关掉标签页即可。';
      }, 120);
    });
  })();
</script>
</body>
</html>
