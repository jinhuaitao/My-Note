<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受保护的文件 · Cloud Note</title>
{{FAVICON}}
<style>
  :root{
    --bg:#08080c; --text:#e8e8f0; --dim:#9a9aae; --border:rgba(255,255,255,.09);
    --accent:#7c5cff; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    background-image:
      radial-gradient(900px 520px at 50% -10%, rgba(124,92,255,.20), transparent 62%),
      radial-gradient(700px 420px at 90% 100%, rgba(34,211,238,.10), transparent 60%);
    color:var(--text);padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  }
  .card{
    width:100%;max-width:380px;text-align:center;padding:40px 34px;
    background:rgba(22,22,30,.72);border:1px solid var(--border);border-radius:20px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .icon{
    width:60px;height:60px;margin:0 auto 20px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);color:var(--warn);
  }
  h1{font-size:18px;margin:0 0 8px;font-weight:600}
  .sub{margin:0 0 26px;font-size:13px;color:var(--dim);line-height:1.6}
  input{
    width:100%;padding:13px 16px;border-radius:11px;text-align:center;letter-spacing:2px;
    background:rgba(255,255,255,.05);border:1px solid var(--border);color:#fff;font-size:15px;
    font-family:inherit;outline:none;transition:border-color .18s ease, background .18s ease;
  }
  input:focus{border-color:var(--accent);background:rgba(255,255,255,.08)}
  .btn{
    width:100%;margin-top:14px;padding:13px;border-radius:11px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#7c5cff,#6d4bf0);color:#fff;font-size:14px;font-weight:500;
    font-family:inherit;transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.35)}
  .notice{
    margin-bottom:18px;padding:10px 14px;border-radius:10px;font-size:13px;text-align:left;
    background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.25);color:#fca5a5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>需要访问密码</h1>
    <p class="sub">该分享链接受密码保护，请输入密码后继续。</p>
    {{ERROR}}
    <form method="POST">
      <input type="password" name="password" placeholder="输入访问密码" required autofocus autocomplete="current-password">
      <button class="btn" type="submit">解锁文件</button>
    </form>
  </div>
</body>
</html>
