<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{FILENAME}} · Cloud Note</title>
{{FAVICON}}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
<style>
  :root{
    --bg:#08080c; --bar:rgba(12,12,18,.82); --border:rgba(255,255,255,.08);
    --text:#dfe0ea; --dim:#9a9aae; --mute:#63637a; --accent:#7c5cff; --ok:#34d399;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;overflow:hidden;
    background:var(--bg);color:var(--text);
    background-image:radial-gradient(900px 460px at 50% -20%, rgba(124,92,255,.16), transparent 62%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Roboto,sans-serif;
  }
  header{
    height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;
    background:var(--bar);border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .file-icon{
    width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(124,92,255,.14);color:#b8a4ff;border:1px solid rgba(124,92,255,.22);
  }
  .meta{min-width:0;flex:1}
  .meta h1{
    margin:0;font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .meta p{margin:3px 0 0;font-size:11px;color:var(--mute);display:flex;gap:8px;align-items:center}
  .badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.3px}
  .badge-readonly{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.25)}
  .badge-admin{background:rgba(124,92,255,.18);color:#c4b5fd;border:1px solid rgba(124,92,255,.3)}
  .actions{display:flex;gap:8px;flex:none}
  .btn{
    padding:7px 13px;border-radius:9px;border:1px solid var(--border);cursor:pointer;font-size:12px;
    background:rgba(255,255,255,.05);color:#c9cad6;font-family:inherit;font-weight:500;
    transition:background .16s ease, color .16s ease, border-color .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
  .btn.primary{background:linear-gradient(135deg,#7c5cff,#6d4bf0);border-color:transparent;color:#fff}
  .btn.primary:hover{box-shadow:0 6px 18px rgba(124,92,255,.35)}
  main{flex:1;position:relative;overflow:hidden}
  .pane{position:absolute;inset:0;overflow:auto;display:none}
  .pane.active{display:block}
  pre[class*="language-"]{
    margin:0!important;min-height:100%;border-radius:0!important;background:transparent!important;
    padding:22px 24px!important;text-shadow:none!important;font-size:13.5px!important;line-height:1.65!important;
  }
  code[class*="language-"]{
    font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace!important;
    font-size:13.5px!important;text-shadow:none!important;
  }
  .line-numbers .line-numbers-rows{border-right:1px solid var(--border)!important}
  .line-numbers-rows > span:before{color:#4a4a5c!important}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}
  /* Markdown 预览 */
  #mdPane{padding:36px 28px 80px}
  .md{max-width:820px;margin:0 auto;font-size:15px;line-height:1.8;color:#d6d7e2;word-wrap:break-word}
  .md h1,.md h2,.md h3,.md h4{color:#fff;line-height:1.35;margin:1.6em 0 .6em;font-weight:650}
  .md h1{font-size:1.75em;border-bottom:1px solid var(--border);padding-bottom:.35em}
  .md h2{font-size:1.4em;border-bottom:1px solid var(--border);padding-bottom:.3em}
  .md h3{font-size:1.18em}
  .md p{margin:0 0 1.1em}
  .md a{color:#a78bfa}
  .md code{
    background:rgba(255,255,255,.08);padding:.18em .42em;border-radius:5px;font-size:.88em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f0abfc;
  }
  .md pre{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:auto}
  .md pre code{background:none;padding:0;color:#d6d7e2}
  .md blockquote{margin:0 0 1.1em;padding:.4em 1.1em;border-left:3px solid var(--accent);background:rgba(124,92,255,.07);border-radius:0 8px 8px 0;color:#b9bacb}
  .md table{border-collapse:collapse;width:100%;margin:0 0 1.2em;font-size:.94em}
  .md th,.md td{border:1px solid var(--border);padding:8px 12px;text-align:left}
  .md th{background:rgba(255,255,255,.05);color:#fff}
  .md img{max-width:100%;border-radius:10px}
  .md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
  .md ul,.md ol{padding-left:1.5em;margin:0 0 1.1em}
  .md li{margin:.3em 0}
  /* HTML 预览 */
  #htmlPane{padding:0}
  #htmlFrame{width:100%;height:100%;border:none;background:#fff}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:10px 20px;border-radius:11px;font-size:13px;color:#fff;
    background:rgba(30,30,40,.94);border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 32px rgba(0,0,0,.5);transition:opacity .22s ease, transform .22s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:640px){
    header{height:auto;padding:10px 12px;flex-wrap:wrap}
    .actions{width:100%;justify-content:flex-end}
    .btn{padding:6px 10px;font-size:11.5px}
    pre[class*="language-"]{padding:16px 14px!important;font-size:12.5px!important}
  }
</style>
</head>
<body>
  <header>
    <div class="file-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
        <polyline points="13 2 13 9 20 9"></polyline>
      </svg>
    </div>
    <div class="meta">
      <h1>{{FILENAME}}</h1>
      <p><span>{{LANG}}</span>{{BADGE}}</p>
    </div>
    <div class="actions">
      {{PREVIEW_BUTTON}}
      <button class="btn" id="downloadBtn" type="button">下载</button>
      <button class="btn primary" id="copyBtn" type="button">复制内容</button>
    </div>
  </header>

  <main>
    <div class="pane active" id="codePane">
      <pre class="line-numbers"><code id="codeBlock" class="language-{{LANG}}">{{CODE}}</code></pre>
    </div>
    <div class="pane" id="mdPane"><div class="md" id="mdBody"></div></div>
    <div class="pane" id="htmlPane"><iframe id="htmlFrame" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer"></iframe></div>
  </main>

  <div class="toast" id="toast"></div>

  <script id="rawData" type="application/json">{{RAW_JSON}}</script>
  <script id="metaData" type="application/json">{{META_JSON}}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script>
  (function () {
    var PREVIEW_KIND = '{{PREVIEW_KIND}}';
    var META = {};
    try { META = JSON.parse(document.getElementById('metaData').textContent || '{}') || {}; } catch (e) { META = {}; }
    // 文件名在 HTML 里是转义过的（用于展示），放进 JS 字符串必须用 JSON 版本，
    // 否则名字里带引号时会变成 &#039; 这样的实体。
    var FILE_NAME = META.filename || 'download.txt';
    var raw = '';
    try { raw = JSON.parse(document.getElementById('rawData').textContent || '""') || ''; } catch (e) { raw = ''; }

    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
    }

    try { if (window.Prism) Prism.highlightAll(); } catch (e) { console.warn(e); }

    document.getElementById('copyBtn').addEventListener('click', function () {
      var text = document.getElementById('codeBlock').innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('内容已复制到剪贴板'); },
          function () { fallbackCopy(text); });
      } else { fallbackCopy(text); }
    });

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('内容已复制到剪贴板'); }
      catch (e) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }

    document.getElementById('downloadBtn').addEventListener('click', function () {
      var blob = new Blob([raw], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = FILE_NAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('已开始下载');
    });

    /* ---------- 预览 ---------- */
    var previewBtn = document.getElementById('previewBtn');
    var showingPreview = false;
    if (previewBtn) {
      previewBtn.addEventListener('click', function () {
        showingPreview = !showingPreview;
        document.getElementById('codePane').classList.toggle('active', !showingPreview);
        if (PREVIEW_KIND === 'markdown') {
          document.getElementById('mdPane').classList.toggle('active', showingPreview);
          if (showingPreview) renderMarkdown();
        } else if (PREVIEW_KIND === 'html') {
          document.getElementById('htmlPane').classList.toggle('active', showingPreview);
          if (showingPreview) {
            var f = document.getElementById('htmlFrame');
            f.srcdoc = raw;
          }
        }
        previewBtn.textContent = showingPreview ? '查看代码' : '预览';
      });
    }

    function renderMarkdown() {
      var body = document.getElementById('mdBody');
      if (body.getAttribute('data-rendered') === '1') return;
      body.innerHTML = '<p style="color:#8b8b9e">正在渲染…</p>';
      loadScript('https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js').then(function () {
        return loadScript('https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js');
      }).then(function () {
        var html = window.marked ? window.marked.parse(raw) : null;
        if (html === null) throw new Error('markdown 渲染库加载失败');
        if (window.DOMPurify) html = window.DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
        body.innerHTML = html;
        body.setAttribute('data-rendered', '1');
      }).catch(function (e) {
        body.innerHTML = '';
        var p = document.createElement('p');
        p.style.color = '#fca5a5';
        p.textContent = '预览失败：' + (e && e.message ? e.message : e);
        body.appendChild(p);
      });
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing) { existing.addEventListener('load', resolve); existing.addEventListener('error', reject); return; }
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('无法加载 ' + src)); };
        document.head.appendChild(s);
      });
    }
  })();
  </script>
</body>
</html>
